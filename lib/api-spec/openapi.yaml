openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sop
    description: SOP retrieval operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Corpus or required service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sop/query:
    post:
      operationId: querySop
      tags: [sop]
      summary: Answer a question from the ingested SOP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SopQuestion"
      responses:
        "200":
          description: Grounded SOP answer with proposition-level citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SopQueryResult"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: SOP content or a required service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        sop_version:
          type: string
        effective_date:
          type: string
          format: date
        source_url:
          type: string
          format: uri
        source_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        chunk_count:
          type: integer
          minimum: 1
        build_sha:
          type: string
          pattern: "^[a-f0-9]{64}$"
        build_sha_kind:
          type: string
          enum: [source-content-sha256]
        git_commit_sha:
          type: [string, "null"]
      required:
        - status
        - sop_version
        - effective_date
        - source_url
        - source_sha256
        - chunk_count
        - build_sha
        - build_sha_kind
        - git_commit_sha
    SopQuestion:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
      required: [question]
    SopSource:
      type: object
      properties:
        source_id:
          type: integer
        section_ref:
          type: string
        quote:
          type: string
        source_chunk:
          type: string
        source_version:
          type: string
        effective_date:
          type: string
        corpus_source_url:
          type: string
          format: uri
        corpus_sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        page_number:
          type: [integer, "null"]
        quote_located:
          type: boolean
        supports_conclusion:
          type: boolean
        applicability_status:
          type: string
          enum: [applicable, not_applicable]
        applicability_reason:
          type: [string, "null"]
        rejection_reason:
          type: [string, "null"]
        application:
          type: [string, "null"]
        program_scope:
          type: array
          items:
            type: string
        verified:
          type: boolean
      required:
        - source_id
        - section_ref
        - quote
        - source_chunk
        - source_version
        - effective_date
        - corpus_source_url
        - corpus_sha256
        - page_number
        - quote_located
        - supports_conclusion
        - applicability_status
        - applicability_reason
        - verified
    SopProposition:
      type: object
      properties:
        text:
          type: string
        arithmetic_valid:
          type: boolean
        citations:
          type: array
          items:
            $ref: "#/components/schemas/SopSource"
      required: [text, arithmetic_valid, citations]
    SopGuarantorRow:
      type: object
      properties:
        party:
          type: string
        capacity:
          type: string
        ownership_percentage:
          type: [number, "null"]
        ownership_comparison:
          type: [string, "null"]
        guaranty_type:
          type: string
        triggering_provision:
          type: string
        additional_conditions:
          type: string
        status:
          type: string
          enum: [required, not_required, unresolved]
        citations:
          type: array
          items:
            $ref: "#/components/schemas/SopSource"
      required:
        - party
        - capacity
        - ownership_percentage
        - ownership_comparison
        - guaranty_type
        - triggering_provision
        - additional_conditions
        - status
        - citations
    SopSubanswer:
      type: object
      properties:
        subquestion_id:
          type: string
        question:
          type: string
        requested_question:
          type: [string, "null"]
        answer:
          type: string
        applied_conclusion:
          anyOf:
            - $ref: "#/components/schemas/SopProposition"
            - type: "null"
        no_provision:
          type: boolean
        support_status:
          type: string
          enum: [supported, not_established, not_applicable, no_responsive_provision, retrieval_empty, unresolved]
        support_note:
          type: [string, "null"]
        stated_facts:
          type: array
          items:
            type: string
        searched_terms:
          type: array
          items:
            type: string
        rejected_citations:
          type: array
          items:
            $ref: "#/components/schemas/SopSource"
        propositions:
          type: array
          items:
            $ref: "#/components/schemas/SopProposition"
        guarantor_rows:
          type: array
          items:
            $ref: "#/components/schemas/SopGuarantorRow"
        gate_telemetry:
          type: array
          items:
            type: object
            additionalProperties: true
        synthesizer_telemetry:
          type: object
          additionalProperties: true
      required:
        - subquestion_id
        - question
        - answer
        - applied_conclusion
        - no_provision
        - support_status
        - support_note
        - searched_terms
        - rejected_citations
        - propositions
        - guarantor_rows
        - gate_telemetry
        - synthesizer_telemetry
    SopQueryResult:
      type: object
      properties:
        answer:
          type: string
        summary:
          type: string
        source_version:
          type: string
        effective_date:
          type: string
        version_warning:
          type: [string, "null"]
        date_warning:
          type: [string, "null"]
        assumptions:
          type: array
          items:
            type: string
        subanswers:
          type: array
          items:
            $ref: "#/components/schemas/SopSubanswer"
        other_issues:
          type: array
          items:
            $ref: "#/components/schemas/SopProposition"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SopSource"
        provisions_to_read:
          type: array
          items:
            $ref: "#/components/schemas/SopSource"
      required:
        - answer
        - summary
        - source_version
        - effective_date
        - version_warning
        - date_warning
        - assumptions
        - subanswers
        - other_issues
        - sources
         - provisions_to_read
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

