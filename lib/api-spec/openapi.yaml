openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sop
    description: SOP retrieval operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sop/query:
    post:
      operationId: querySop
      tags: [sop]
      summary: Answer a question from the ingested SOP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SopQuestion"
      responses:
        "200":
          description: Grounded answer and cited SOP sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SopQueryResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: SOP content or a required service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SopQuestion:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 4000
      required: [question]
    SopSource:
      type: object
      properties:
        section_ref:
          type: string
        quote:
          type: string
        source_chunk:
          type: string
        verified:
          type: boolean
      required: [section_ref, quote, source_chunk, verified]
    SopQueryResult:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SopSource"
      required: [answer, sources]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

