name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -p "test_*.py"
      - run: uv run python -m py_compile artifacts/api-server/app.py artifacts/api-server/auth.py artifacts/api-server/source_metadata.py scripts/ingest_sop.py scripts/run_sop_regression.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: PORT=23318 BASE_PATH=/ pnpm --filter @workspace/sop-query-tool run build