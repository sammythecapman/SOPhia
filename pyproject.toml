description = "Authenticated, source-grounded SBA SOP query service"
requires-python = ">=3.10"
dependencies = [
    "authlib>=1.8.0",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "openai>=3.14.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "python-docx>=1.2.0",
    "requests>=2.34.2",
]
